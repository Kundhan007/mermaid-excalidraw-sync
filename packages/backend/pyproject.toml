[project]
name = "mermaid-excalidraw-sync-backend"
version = "0.1.0"
description = "FastAPI backend: file management, watching, and version control for the diagram workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
